# Render Blueprint — free web service built from ./Dockerfile.
# The database lives on Neon (free, PostGIS included); paste its connection
# string when Render asks for DATABASE_URL.
services:
  - type: web
    name: kadi-atlas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      # optional: set it to hide source texts from visitors (user view);
      # administrators log in at /admin/login. Leave empty for open access.
      - key: KADI_ATLAS__ADMIN_PASSWORD
        sync: false
